name: Licitações do Diário Oficial de São Paulo
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/teste-agendamento.yml'
      - 'scripts/notificar_actions.py'
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: read

concurrency:
  group: diario-oficial-licitacoes
  cancel-in-progress: false

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar consulta ao painel municipal
        run: python3 -m pip install playwright==1.56.0
      - name: Consultar a edição e enviar relatório
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: python3 scripts/notificar_actions.py
