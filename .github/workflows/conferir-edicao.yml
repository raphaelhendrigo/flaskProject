name: Conferir formato da edição oficial
on:
  push:
    paths: ['.github/workflows/conferir-edicao.yml']
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: python -m pip install playwright==1.56.0
      - run: |
          python - <<'PY'
          from urllib.request import urlopen
          from urllib.parse import urljoin
          from html import unescape
          import re,json
          p='https://diariooficial.prefeitura.sp.gov.br/md_epubli_controlador.php?acao=diario_aberto&formato=A'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          with sync_playwright() as pw:
              b=pw.chromium.launch(channel="chrome")
              page=b.new_page(locale="pt-BR")
              page.goto(p,wait_until="domcontentloaded")
              link=page.get_by_role("link",name="JSON",exact=True).first
              print("Link JSON",link.get_attribute("href"),flush=True)
              info=page.evaluate("""async path => {const r=await fetch(path);let t=await r.text(); return {status:r.status,kind:r.headers.get('content-type'),length:t.length,first:t.slice(0,150),text:t};}""",link.get_attribute("href"))
          body=info.pop("text")
          print("Resposta",info,flush=True)
          data,n=json.JSONDecoder().raw_decode(body.lstrip(chr(65279)))
          print("final",repr(body[n:n+100]))
          from collections import Counter
          print("secoes",Counter(x['veiculo'] for x in data['edicao']))
          rows=[x for x in data['edicao'] if x['veiculo']=='Negócios']
          print("tipos",Counter(x['serie'] for x in rows).most_common(30))
          from html import unescape
          for row in rows[:6]:
              print("estrutura", ' '.join(unescape(re.sub(r'<[^>]+>',' ',row['conteudo'])).split())[:650])
          def walk(o,path=()):
              if len(path)>8:return
              if isinstance(o,dict):
                  print(path,list(o)[:30])
                  for k,v in list(o.items())[:30]:
                      if isinstance(v,(dict,list)):walk(v,path+(k,))
              if isinstance(o,list) and o:
                  print("LIST",path,len(o))
                  walk(o[0],path+(0,))
          walk(data)
          PY
